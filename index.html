<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kid Stories</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@700;800&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:        #0f0f0f;
    --paper:      #fdf6e8;
    --paper-dark: #f0e8d4;
    --green:      #16a34a;
    --caption-bg: #FFE342;
    --page-gap:   #111;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--page-gap);
    background-image: radial-gradient(circle, rgba(255,255,255,.025) 1px, transparent 1px);
    background-size: 10px 10px;
    font-family: 'Patrick Hand', cursive;
    color: var(--ink);
    min-height: 100vh;
  }

  .wrap {
    max-width: 760px;
    margin: 0 auto;
    padding: 30px 14px 60px;
  }

  h1 {
    font-family: 'Bangers', cursive;
    font-size: 52px;
    letter-spacing: 3px;
    text-align: center;
    color: var(--caption-bg);
    -webkit-text-stroke: 2px var(--ink);
    text-stroke: 2px var(--ink);
    text-shadow: 4px 4px 0 var(--ink);
    margin-bottom: 8px;
  }

  .subtitle {
    text-align: center;
    font-size: 20px;
    color: var(--paper);
    margin-bottom: 32px;
  }

  .folder {
    background: var(--paper);
    border: 5px solid var(--ink);
    border-radius: 6px;
    box-shadow: 6px 6px 0 rgba(0,0,0,.7);
    margin-bottom: 28px;
    overflow: hidden;
  }

  .folder-title {
    background: var(--green);
    color: white;
    font-family: 'Bangers', cursive;
    font-size: 26px;
    letter-spacing: 2px;
    padding: 10px 18px;
    border-bottom: 4px solid var(--ink);
  }

  .stories {
    list-style: none;
    padding: 14px 18px 18px;
  }

  .stories li + li {
    margin-top: 10px;
  }

  .stories a {
    display: block;
    font-size: 21px;
    color: var(--ink);
    text-decoration: none;
    background: var(--paper-dark);
    border: 2px solid var(--ink);
    border-radius: 4px;
    padding: 10px 14px;
    transition: transform .08s ease, box-shadow .08s ease;
    box-shadow: 3px 3px 0 rgba(0,0,0,.5);
  }

  .stories a:hover {
    transform: translate(-2px, -2px);
    box-shadow: 5px 5px 0 rgba(0,0,0,.5);
    background: var(--caption-bg);
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Kid Stories</h1>
    <p class="subtitle">Pick a story to read!</p>

    <div class="folder">
      <div class="folder-title">Amelia</div>
      <ul class="stories">
        <li><a href="Amelia/Baby Witchy/baby-witchy-and-the-stolen-glimmer-berries.html">Baby Witchy and the Stolen Glimmer Berries</a></li>
        <li><a href="Amelia/Jedi Lats'e/lats'e-and-the-lost-younglings.html">Lats'e and the Lost Younglings</a></li>
        <li><a href="Amelia/Jedi Lats'e/lats'e-and-the-not-so-bad-pirate.html">Lats'e and the Not-So-Bad Pirate</a></li>
        <li><a href="Amelia/Jedi Lats'e/lats'e-and-the-seeds-of-bazarri.html">Lats'e and the Seeds of Bazarri</a></li>
        <li><a href="Amelia/Tinker Fairy/tinkerfairy-issue-1-anger-in-the-city.html">Tinkerfairy #1 — Anger in the City</a></li>
      </ul>
    </div>
  </div>
</body>
</html>
